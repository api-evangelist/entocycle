name: Entocycle
description: >-
  Entocycle is a London-based insect farming technology company building
  industrial-scale, controlled-environment facilities that use black soldier fly
  bioconversion to turn organic waste streams into insect protein for animal feed
  and organic fertilizer (frass). Its platform combines modular climate-controlled
  farm infrastructure, real-time AI-driven insect monitoring that counts and tracks
  insects across their lifecycle, and fully automated production systems to
  standardize output across deployments worldwide. Entocycle partners with waste
  management companies, agricultural producers, insect companies, and offtake
  buyers to develop and operate circular-economy insect farms. It was surfaced as a
  portfolio company of DCVC and added to the API Evangelist network; the company
  publishes no public API, developer portal, or SDKs at this time.
